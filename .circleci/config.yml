version: 2.1
jobs:
  lint:
      docker:
        - image: salsify/ruby_ci:2.6.6
      working_directory: ~/roo
      steps:
        - checkout
        - restore_cache:
            keys:
              - v1-gems-ruby-2.6.6-{{ checksum "roo.gemspec" }}-{{ checksum "Gemfile" }}
              - v1-gems-ruby-2.6.6-
        - run:
            name: Install Gems
            command: |
              if ! bundle check --path=vendor/bundle; then
                bundle install --path=vendor/bundle --jobs=4 --retry=3
                bundle clean
              fi
        - save_cache:
            key: v1-gems-ruby-2.6.6-{{ checksum "roo.gemspec" }}-{{ checksum "Gemfile" }}
            paths:
              - "vendor/bundle"
              - "gemfiles/vendor/bundle"
        - run:
            name: Run Rubocop
            command: bundle exec rubocop --config .rubocop.yml
  test:
      parameters:
        gemfile:
          type: string
        ruby_version:
          type: string
      docker:
        - image: salsify/ruby_ci:<< parameters.ruby_version >>
          environment:
            DB_USER: "circleci"
        - image: circleci/postgres:9.6
          environment:
            POSTGRES_USER: "circleci"
            POSTGRES_DB: "circle_test"
            POSTGRES_HOST_AUTH_METHOD: "trust"
      environment:
        RACK_ENV: "test"
        RAILS_ENV: "test"
        CIRCLE_TEST_REPORTS: "test-results"
        BUNDLE_GEMFILE: << parameters.gemfile >>
      working_directory: ~/roo
      steps:
        - checkout
        - restore_cache:
            keys:
              - v1-gems-ruby-<< parameters.ruby_version >>-{{ checksum "roo.gemspec" }}-{{ checksum "<< parameters.gemfile >>" }}
              - v1-gems-ruby-<< parameters.ruby_version >>-
        - run:
            name: Install Gems
            command: |
              if ! bundle check --path=vendor/bundle; then
                bundle install --path=vendor/bundle --jobs=4 --retry=3
                bundle clean
              fi
        - save_cache:
            key: v1-gems-ruby-<< parameters.ruby_version >>-{{ checksum "roo.gemspec" }}-{{ checksum "<< parameters.gemfile >>" }}
            paths:
              - "vendor/bundle"
              - "gemfiles/vendor/bundle"
        - run:
            name: Run Tests
            command: |
              bundle exec rspec --format RspecJunitFormatter --out $CIRCLE_TEST_REPORTS/rspec/junit.xml --format progress spec &&
                          bundle exec rake test
        - store_test_results:
            path: "test-results"
workflows:
  build:
    jobs:
      - lint
      - test:
          matrix:
            parameters:
              gemfile:
                - "Gemfile"
              ruby_version:
                - "2.6.8"
                - "2.7.4"
                - "3.0.2"
