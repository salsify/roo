version: 2.1

aws-auth: &aws-auth
  aws_auth:
    aws_access_key_id: $ECR_AWS_ACCESS_KEY_ID
    aws_secret_access_key: $ECR_AWS_SECRET_ACCESS_KEY

jobs:
  lint:
      docker:
        - image: $SALSIFY_ECR_REPO/ruby-ci-3_3_14
          <<: *aws-auth
      working_directory: ~/roo
      steps:
        - checkout
        - restore_cache:
            keys:
              - v1-gems-ruby-3.3.14-{{ checksum "roo.gemspec" }}-{{ checksum "Gemfile" }}
              - v1-gems-ruby-3.3.14-
        - run:
            name: Install Gems
            command: |
              bundle config set path 'vendor/bundle'
              if ! bundle check; then
                bundle install --jobs=4 --retry=3
                bundle clean
              fi
        - save_cache:
            key: v1-gems-ruby-3.3.14-{{ checksum "roo.gemspec" }}-{{ checksum "Gemfile" }}
            paths:
              - "vendor/bundle"
              - "gemfiles/vendor/bundle"
        - run:
            name: Run Rubocop
            command: bundle exec rubocop --config .rubocop.yml
  test:
      parameters:
        gemfile:
          type: string
        ruby_version:
          type: string
      docker:
        - image: $SALSIFY_ECR_REPO/ruby-ci-<< parameters.ruby_version >>
          <<: *aws-auth
          environment:
            DB_USER: "circleci"
        - image: cimg/postgres:14.4
          environment:
            POSTGRES_USER: "ubuntu"
            POSTGRES_DB: "circle_test"
            POSTGRES_HOST_AUTH_METHOD: "trust"
            PSQL_PAGER: ""
      environment:
        RACK_ENV: "test"
        RAILS_ENV: "test"
        CIRCLE_TEST_REPORTS: "test-results"
        BUNDLE_GEMFILE: << parameters.gemfile >>
      working_directory: ~/roo
      steps:
        - checkout
        - restore_cache:
            keys:
              - v1-gems-ruby-<< parameters.ruby_version >>-{{ checksum "roo.gemspec" }}-{{ checksum "<< parameters.gemfile >>" }}
              - v1-gems-ruby-<< parameters.ruby_version >>-
        - run:
            name: Install Gems
            command: |
              bundle config set path 'vendor/bundle'
              if ! bundle check; then
                bundle install --jobs=4 --retry=3
                bundle clean
              fi
        - save_cache:
            key: v1-gems-ruby-<< parameters.ruby_version >>-{{ checksum "roo.gemspec" }}-{{ checksum "<< parameters.gemfile >>" }}
            paths:
              - "vendor/bundle"
              - "gemfiles/vendor/bundle"
        - run:
            name: Run Tests
            command: |
              bundle exec rspec --format RspecJunitFormatter --out $CIRCLE_TEST_REPORTS/rspec/junit.xml --format progress spec &&
                          bundle exec rake test
        - store_test_results:
            path: "test-results"
workflows:
  build:
    jobs:
      - lint:
          context: Salsify
      - test:
          context: Salsify
          matrix:
            parameters:
              gemfile:
                - "Gemfile"
              ruby_version:
                - "3_3_14"
                - "3_4_13"
                - "4_0_10"
